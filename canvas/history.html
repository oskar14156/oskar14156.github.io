<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>History — The Charity Canvas</title><link rel="icon" href="/canvas/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/canvas/style.css"><script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");</script>
<style>
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.frame{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--stage);
  border:1px solid var(--line)}
.frame img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.frame .stamp{position:absolute;left:12px;top:12px;background:rgba(13,13,17,.82);color:#e9e9f0;
  border-radius:8px;padding:6px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;gap:12px;margin-top:14px}
.ctrls input[type=range]{flex:1;accent-color:var(--accent);margin:0}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;
  display:grid;place-items:center;flex:0 0 auto}
.speed{display:flex;gap:4px}
.speed button{padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);font-size:12px}
.speed button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style><script src="/canvas/demo-shim.js"></script></head><body>
