<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Internet's Charity Canvas</title>
<meta name="description" content="One million pixels. Draw anything. 25c of every euro goes to charity, and every cent of the rest is published.">
<meta property="og:type" content="website">
<meta property="og:title" content="The Internet's Charity Canvas">
<meta property="og:description" content="One million pixels. Draw anything, keep it forever or rent it for a week. 25% of every euro goes to charity and every cent of the rest is published.">
<meta property="og:image" content="/canvas/api/card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/canvas/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/canvas/style.css">
<script>
  // Applied before first paint so there is no flash of the wrong theme.
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<script src="/canvas/demo-shim.js"></script></head>
<body class="app">
<div id="app">
  <header>
    <a href="/canvas/" class="brand" style="color:inherit">THE CHARITY CANVAS<small id="canvasName">Canvas #1</small></a>
    <div class="hstat"><b id="statClaimed">—</b><span>pixels claimed</span></div>
    <div class="hstat"><b id="statCharity">—</b><span id="statCharityLabel">to charity</span></div>
    <div class="spacer"></div>
    <nav>
      <a href="/canvas/" class="on">Canvas</a>
      <a href="/canvas/leaderboard.html">Territories</a>
      <a href="/canvas/history.html">History</a>
      <a href="/canvas/transparency.html">The money</a>
      <a href="/canvas/about.html">How it works</a>
      <a href="#" id="navMine">Mine</a>
      <button class="icobtn" id="themeBtn" title="Toggle light / dark">◐</button>
    </nav>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="countdown" class="float"></div>
    <div id="hovercard" class="float"></div>
    <div id="hud" class="float">
      <button id="zoomOut" title="Zoom out">−</button>
      <span id="zoomLbl">1x</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomFit" title="Fit whole canvas">⤢</button>
    </div>
    <div id="coords" class="float">—</div>
    <div id="minimap" class="float"><canvas id="mini" width="130" height="130"></canvas>
      <div id="miniview"></div></div>
    <div id="expiry" class="float"></div>
  </div>

  <aside id="panel"></aside>
</div>
<script type="module" src="/canvas/app.js"></script>
</body>
</html>
